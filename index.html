<script type="text/babel">
const { useState, useEffect, useRef } = React;

function haversine(a, b) {
  const R = 6371;
  const dLat = ((b.latitude - a.latitude) * Math.PI) / 180;
  const dLon = ((b.longitude - a.longitude) * Math.PI) / 180;
  const lat1 = (a.latitude * Math.PI) / 180;
  const lat2 = (b.latitude * Math.PI) / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function reverseGeocode(lat, lon) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
    const data = await res.json();
    const a = data.address || {};
    const ort = a.city || a.town || a.village || a.municipality || a.county || a.state || "";
    const strasse = a.road || a.pedestrian || a.footway || "";
    const hausnr = a.house_number || "";
    const strasseVoll = strasse ? `${strasse}${hausnr ? " " + hausnr : ""}` : "";
    const ortVoll = a.postcode && ort ? `${a.postcode} ${ort}` : ort;
    // Reihenfolge: PLZ, Ort, Straße Nummer
    const label = strasseVoll && ortVoll ? `${ortVoll}, ${strasseVoll}` : strasseVoll || ortVoll;
    return label || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  } catch {
    return `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  }
}

// Bridge zur React-Komponente: wird beim Mounten gesetzt, damit die (außerhalb der Komponente
// liegenden) Geokodierungsfunktionen bei Mehrdeutigkeit eine Auswahl in der UI anzeigen können.
let placeChooser = null;

function dedupeCandidates(data) {
  const seen = new Set();
  const out = [];
  for (const d of data) {
    const a = d.address || {};
    const postcode = a.postcode || "";
    const label = a.city || a.town || a.village || a.municipality || (d.display_name || "").split(",")[0];
    const region = a.state || a.county || "";
    const road = a.road || a.pedestrian || a.footway || "";
    const houseNumber = a.house_number || "";
    const key = postcode + "|" + label;
    if (!seen.has(key)) {
      seen.add(key);
      out.push({ lat: parseFloat(d.lat), lon: parseFloat(d.lon), postcode, label, region, road, houseNumber });
    }
  }
  return out;
}

// Ergänzt eine manuell eingegebene Ortsangabe live um die Postleitzahl (OpenStreetMap/Nominatim),
// beschränkt auf Österreich, Deutschland, Südtirol/Italien und die Schweiz.
// Wurde statt einer Adresse ein Firmenname/POI eingegeben (z. B. "Media Markt Innsbruck"),
// wird die dazu gefundene genaue Adresse (Straße, Hausnummer, PLZ, Ort) zusätzlich zum
// eingegebenen Namen gespeichert, z. B. "Media Markt Innsbruck, Bahnhofstraße 5, 6020 Innsbruck".
async function withPLZ(placeName) {
  const name = (placeName || "").trim();
  if (!name) return name;
  if (/\b\d{4,5}\b/.test(name)) return name; // enthält schon eine PLZ-ähnliche Zahl
  const hit = await geocodeName(name);
  if (!hit) return name;
  if (hit.road && !name.toLowerCase().includes(hit.road.toLowerCase())) {
    const strasse = hit.houseNumber ? `${hit.road} ${hit.houseNumber}` : hit.road;
    const ortTeil = hit.postcode && hit.label ? `${hit.postcode} ${hit.label}` : hit.label || "";
    return ortTeil ? `${name}, ${strasse}, ${ortTeil}` : `${name}, ${strasse}`;
  }
  if (hit.postcode) return `${hit.postcode} ${name}`;
  try {
    const revRes = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${hit.lat}&lon=${hit.lon}&zoom=16&addressdetails=1`
    );
    const revData = await revRes.json();
    const plz = revData && revData.address && revData.address.postcode;
    return plz ? `${plz} ${name}` : name;
  } catch {
    return name;
  }
}

// Ermittelt Koordinaten für einen Ortsnamen (für Routenberechnung und PLZ-Ergänzung).
// Sucht zuerst in Österreich (Hauptland des Fahrzeugs), erst danach in DE/CH/Südtirol.
// Werden mehrere unterschiedliche Orte mit demselben Namen gefunden, fragt die App
// über placeChooser nach, welcher gemeint ist (Auswahl mit PLZ und Ort).
async function geocodeName(name) {
  const countryGroups = ["at", "de,ch,it"];
  for (const cc of countryGroups) {
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(name)}&countrycodes=${cc}&addressdetails=1&limit=6`
      );
      const data = await res.json();
      if (data && data.length) {
        const candidates = dedupeCandidates(data);
        if (candidates.length === 1 || !placeChooser) {
          return candidates[0];
        }
        const chosen = await placeChooser(name, candidates);
        return chosen || null;
      }
    } catch {}
  }
  return null;
}

// Berechnet die Straßen-Strecke (nicht Luftlinie) über eine Reihe bereits bekannter Koordinaten
// (Start, per GPS erfasste Zwischenziele, Ziel) via OSRM.
async function routeKmFromCoords(points) {
  if (points.length < 2) return null;
  const coordStr = points.map((p) => `${p.lon},${p.lat}`).join(";");
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=false`);
    const data = await res.json();
    if (data.code === "Ok" && data.routes && data.routes[0]) {
      return data.routes[0].distance / 1000;
    }
  } catch {}
  return null;
}

async function computeRouteKmDetailed(addresses) {
  const coords = [];
  for (const addr of addresses) {
    const g = await geocodeName(addr);
    if (!g) return { km: null, failedAddress: addr };
    coords.push(`${g.lon},${g.lat}`);
  }
  if (coords.length < 2) return { km: null, failedAddress: null };
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords.join(";")}?overview=false`);
    const data = await res.json();
    if (data.code === "Ok" && data.routes && data.routes[0]) {
      return { km: data.routes[0].distance / 1000, failedAddress: null };
    }
  } catch {}
  return { km: null, failedAddress: null };
}

async function computeRouteKm(addresses) {
  const result = await computeRouteKmDetailed(addresses);
  return result.km;
}

// Reiht mehrere withPLZ-Aufrufe nacheinander statt parallel, damit bei Mehrdeutigkeiten
// die Auswahl-Anzeige pro Ort nacheinander erscheint statt mehrfach gleichzeitig.
async function withPLZSequential(names) {
  const out = [];
  for (const n of names) {
    out.push(await withPLZ(n));
  }
  return out;
}

// Prüft, ob die eingegebene Kilometerzahl zur Route über Start → Zwischenziele → Ziel passt,
// und korrigiert sie bei größeren Abweichungen automatisch auf die berechnete Streckenlänge.
async function verifyRouteKm(addresses, enteredKm) {
  if (addresses.length < 2) return { km: enteredKm, corrected: false };
  const routeKm = await computeRouteKm(addresses);
  if (routeKm == null) return { km: enteredKm, corrected: false };
  const tolerance = Math.max(3, routeKm * 0.25);
  if (enteredKm == null || Math.abs(enteredKm - routeKm) > tolerance) {
    return { km: Math.round(routeKm), corrected: true };
  }
  return { km: enteredKm, corrected: false };
}

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("Kein GPS verfügbar"));
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0,
    });
  });
}

// Großschreibt automatisch den ersten Buchstaben jedes Wortes einer Ortsangabe
// (z. B. "st. johann" -> "St. Johann"), der Rest bleibt unverändert.
function capitalizeWords(str) {
  return str.replace(/(^|[\s.\-\/])(\p{L})/gu, (m, sep, letter) => sep + letter.toUpperCase());
}

function fmtDate(d) { return d.toLocaleDateString("de-DE"); }
function fmtTime(d) { return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); }
function fmtElapsed(sec) {
  const totalMin = Math.floor(sec / 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h} Std ${String(m).padStart(2, "0")} Min`;
}

const ZWECK_PRESETS = ["Kundenbesuch", "Meeting", "Auslieferung", "Materialeinkauf", "Sonstiges"];
const ZWECK_COLORS = [
  "bg-green-600 border-green-600",
  "bg-teal-600 border-teal-600",
  "bg-lime-600 border-lime-600",
  "bg-amber-500 border-amber-500",
  "bg-emerald-700 border-emerald-700",
];
const STORAGE_KEY = "fahrtenbuch_trips";
const ACTIVE_KEY = "fahrtenbuch_active_trip";
const FAHRER = "Ulrich J. Zeni";
const FAHRZEUG = "BMW iX1 / I-2372 AZ";
const KENNZEICHEN = "I-2372 AZ";
const REPORT_EMAIL = "ulrich.zeni@lk-tirol.at";
const MONTH_REPORT_KEY = "fahrtenbuch_last_month_report";

function saveActiveTrip(data) {
  try { localStorage.setItem(ACTIVE_KEY, JSON.stringify(data)); } catch {}
}
function loadActiveTrip() {
  try { const raw = localStorage.getItem(ACTIVE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function clearActiveTrip() {
  try { localStorage.removeItem(ACTIVE_KEY); } catch {}
}
function pad2(n) { return String(n).padStart(2, "0"); }
function toDateInputValue(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function toTimeInputValue(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

function Fahrtenbuch() {
  const [trips, setTrips] = useState(() => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
  });
  const [monthReport, setMonthReport] = useState(null);
  const [kmNotice, setKmNotice] = useState(null);
  const noticeIdRef = useRef(0);
  const notifyKmCorrection = (km) => {
    const id = ++noticeIdRef.current;
    setKmNotice({ id, km });
    setTimeout(() => {
      setKmNotice((cur) => (cur && cur.id === id ? null : cur));
    }, 6000);
  };

  const [addingWaypoint, setAddingWaypoint] = useState(false);
  const [waypointNotice, setWaypointNotice] = useState(null);
  const waypointNoticeIdRef = useRef(0);
  const notifyWaypointAdded = (address) => {
    const id = ++waypointNoticeIdRef.current;
    setWaypointNotice({ id, address });
    setTimeout(() => {
      setWaypointNotice((cur) => (cur && cur.id === id ? null : cur));
    }, 5000);
  };

  const [placeChoice, setPlaceChoice] = useState(null); // { name, candidates } | null
  const placeChoiceResolveRef = useRef(null);
  const resolvePlaceChoice = (name, candidates) =>
    new Promise((resolve) => {
      placeChoiceResolveRef.current = resolve;
      setPlaceChoice({ name, candidates });
    });
  const selectPlaceChoice = (candidate) => {
    if (placeChoiceResolveRef.current) placeChoiceResolveRef.current(candidate);
    placeChoiceResolveRef.current = null;
    setPlaceChoice(null);
  };
  const cancelPlaceChoice = () => {
    if (placeChoiceResolveRef.current) placeChoiceResolveRef.current(null);
    placeChoiceResolveRef.current = null;
    setPlaceChoice(null);
  };
  useEffect(() => {
    placeChooser = resolvePlaceChoice;
    return () => {
      placeChooser = null;
    };
    // eslint-disable-next-line
  }, []);

  const [status, setStatus] = useState("idle");
  const [error, setError] = useState("");
  const [elapsed, setElapsed] = useState(0);
  const [pendingTrip, setPendingTrip] = useState(null);
  const [zweckInput, setZweckInput] = useState("");
  const [month, setMonth] = useState(() => new Date().toISOString().slice(0, 7));
  const [showArchive, setShowArchive] = useState(false);
  const [showManual, setShowManual] = useState(false);
  const [manualForm, setManualForm] = useState({ date: "", startTime: "", endTime: "", startAddress: "", endAddress: "", km: "", zweck: "", waypoints: [] });
  const [manualError, setManualError] = useState("");
  const [odoStep, setOdoStep] = useState(null); // null | "start" | "end"
  const [odoPhoto, setOdoPhoto] = useState(null);
  const [odoValue, setOdoValue] = useState("");
  const [odoLoading, setOdoLoading] = useState(false);
  const [odoError, setOdoError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [editError, setEditError] = useState("");
  const [endFallback, setEndFallback] = useState(null);
  const [endFallbackForm, setEndFallbackForm] = useState({ address: "", km: "", endOdo: "" });
  const [endFallbackError, setEndFallbackError] = useState("");
  const [needsStartAddress, setNeedsStartAddress] = useState(false);
  const [startAddressInput, setStartAddressInput] = useState("");
  const [pendingKmForm, setPendingKmForm] = useState({ startOdo: "", endOdo: "", km: "" });
  const [pendingWaypoints, setPendingWaypoints] = useState([]);
  const [manualSaving, setManualSaving] = useState(false);
  const [manualRouteLoading, setManualRouteLoading] = useState(false);
  const [manualRouteError, setManualRouteError] = useState("");
  const [editSaving, setEditSaving] = useState(false);
  const [endFallbackSaving, setEndFallbackSaving] = useState(false);
  const [endFallbackWaypoints, setEndFallbackWaypoints] = useState([]);
  const [routeCalcLoading, setRouteCalcLoading] = useState(false);
  const [routeCalcError, setRouteCalcError] = useState("");
  const [odoSaving, setOdoSaving] = useState(false);
  const [zweckSaving, setZweckSaving] = useState(false);

  const startRef = useRef(null);
  const timerRef = useRef(null);
  const waypointsRef = useRef([]);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(trips));
  }, [trips]);

  const startTrip = async () => {
    setError("");
    let pos = null;
    try {
      pos = await getPosition();
    } catch (e) {
      pos = null;
    }

    const now = new Date();

    if (pos) {
      const { latitude, longitude } = pos.coords;
      const address = await reverseGeocode(latitude, longitude);
      startRef.current = { time: now.toISOString(), lat: latitude, lon: longitude, address, odoKm: null };
      setNeedsStartAddress(false);
    } else {
      startRef.current = { time: now.toISOString(), lat: null, lon: null, address: null, odoKm: null };
      setNeedsStartAddress(true);
      setStartAddressInput("");
    }

    waypointsRef.current = [];
    setElapsed(0);
    setStatus("active");

    saveActiveTrip({ start: startRef.current, waypoints: [] });

    startTimer(now.getTime());

    setOdoPhoto(null);
    setOdoValue("");
    setOdoError("");
    setOdoStep("start");
  };

  const startTimer = (startTimeMs) => {
    timerRef.current = setInterval(() => {
      setElapsed(Math.floor((Date.now() - startTimeMs) / 1000));
    }, 1000);
  };

  const addCurrentAsWaypoint = async () => {
    setAddingWaypoint(true);
    try {
      const pos = await getPosition();
      const { latitude, longitude } = pos.coords;
      const address = await reverseGeocode(latitude, longitude);
      waypointsRef.current.push({ address, lat: latitude, lon: longitude, arrival: new Date().toISOString(), departure: null });
      saveActiveTrip({ start: startRef.current, waypoints: waypointsRef.current });
      notifyWaypointAdded(address);
    } catch {
      setError("Standort konnte nicht ermittelt werden. Zwischenziel wurde nicht hinzugefügt.");
    }
    setAddingWaypoint(false);
  };

  // Beim Öffnen der App prüfen, ob eine Fahrt noch läuft (auch nach Schließen/Neuöffnen)
  useEffect(() => {
    try {
      const saved = loadActiveTrip();
      if (saved && saved.start && saved.start.time) {
        startRef.current = saved.start;
        waypointsRef.current = Array.isArray(saved.waypoints) ? saved.waypoints : [];
        const startMs = new Date(saved.start.time).getTime();
        if (isNaN(startMs)) throw new Error("invalid start time");
        setElapsed(Math.max(0, Math.floor((Date.now() - startMs) / 1000)));
        setStatus("active");
        startTimer(startMs);
        if (!saved.start.address) {
          setNeedsStartAddress(true);
          setStartAddressInput("");
          setOdoPhoto(null);
          setOdoValue("");
          setOdoError("");
          setOdoStep("start");
        }
      }
    } catch (e) {
      // Beschädigte/veraltete Fahrt-Daten aus einer früheren Version: nicht die ganze App blockieren,
      // sondern sauber im Ruhezustand starten.
      clearActiveTrip();
      setStatus("idle");
    }
    // eslint-disable-next-line
  }, []);

  const endTrip = async () => {
    setError("");
    clearInterval(timerRef.current);
    clearActiveTrip();
    setStatus("idle");

    let pos = null;
    try {
      pos = await getPosition();
    } catch (e) {
      pos = null;
    }

    // Ohne Standort am Ende UND ohne Standort am Start kann keine Route berechnet werden
    if (!pos || startRef.current.lat == null) {
      let address = "";
      let lat = null;
      let lon = null;
      if (pos) {
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
        try { address = await reverseGeocode(lat, lon); } catch { address = ""; }
      }
      setEndFallback({ reason: "gps", lat, lon, rawEstimate: null });
      setEndFallbackForm({ address, km: "", endOdo: "" });
      setEndFallbackWaypoints((waypointsRef.current || []).map((w) => w.address));
      setEndFallbackError("");
      setRouteCalcError("");
      return;
    }

    const { latitude, longitude } = pos.coords;
    const validWaypoints = (waypointsRef.current || []).filter((w) => w.lat != null && w.lon != null);
    const points = [
      { lat: startRef.current.lat, lon: startRef.current.lon },
      ...validWaypoints.map((w) => ({ lat: w.lat, lon: w.lon })),
      { lat: latitude, lon: longitude },
    ];
    const routeKm = await routeKmFromCoords(points);

    if (routeKm == null) {
      // Route konnte nicht berechnet werden (z. B. OSRM nicht erreichbar) - manuell nachtragen lassen
      let address = "";
      try { address = await reverseGeocode(latitude, longitude); } catch { address = ""; }
      setEndFallback({ reason: "route", lat: latitude, lon: longitude, rawEstimate: null });
      setEndFallbackForm({ address, km: "", endOdo: "" });
      setEndFallbackWaypoints((waypointsRef.current || []).map((w) => w.address));
      setEndFallbackError("");
      setRouteCalcError("");
      return;
    }

    const address = await reverseGeocode(latitude, longitude);
    const km = Math.max(Math.round(routeKm), 1);
    const endOdoKm = startRef.current.odoKm != null ? Math.round(startRef.current.odoKm + km) : null;
    setPendingTrip({
      start: startRef.current,
      end: { time: new Date().toISOString(), lat: latitude, lon: longitude, address, odoKm: endOdoKm },
      km,
      waypoints: waypointsRef.current,
    });
    setZweckInput("");
  };

  const fallbackKmChange = (value) => {
    setEndFallbackForm((f) => {
      const startNum = num(startRef.current.odoKm);
      const kmNum = num(value);
      const endOdo = startNum != null && kmNum != null ? String(Math.round(startNum + kmNum)) : f.endOdo;
      return { ...f, km: value, endOdo };
    });
  };

  const fallbackEndOdoChange = (value) => {
    setEndFallbackForm((f) => {
      const startNum = num(startRef.current.odoKm);
      const endNum = num(value);
      const km = startNum != null && endNum != null ? String(Math.max(0, Math.round(endNum - startNum))) : f.km;
      return { ...f, endOdo: value, km };
    });
  };

  const addFallbackWaypoint = () => setEndFallbackWaypoints((wp) => [...wp, ""]);
  const updateFallbackWaypoint = (i, value) => setEndFallbackWaypoints((wp) => wp.map((w, idx) => (idx === i ? value : w)));
  const removeFallbackWaypoint = (i) => setEndFallbackWaypoints((wp) => wp.filter((_, idx) => idx !== i));

  const routeAddressChain = () =>
    [startRef.current.address, ...endFallbackWaypoints.filter((w) => w.trim()), endFallbackForm.address].filter((a) => a && a.trim());

  const calcRouteFromWaypoints = async () => {
    const addresses = routeAddressChain();
    if (addresses.length < 2) {
      setRouteCalcError("Dafür werden mindestens Start- und Zieladresse benötigt.");
      return null;
    }
    setRouteCalcLoading(true);
    setRouteCalcError("");
    const result = await computeRouteKmDetailed(addresses);
    setRouteCalcLoading(false);
    if (result.km == null) {
      setRouteCalcError(
        result.failedAddress
          ? `Ort „${result.failedAddress}" konnte nicht gefunden werden. Bitte Schreibweise prüfen (z. B. nur Ortsname, ohne Zusätze wie „in Tirol").`
          : "Route konnte nicht berechnet werden (Straßenverbindung nicht gefunden). Bitte Kilometer manuell eingeben."
      );
      return null;
    }
    fallbackKmChange(String(Math.round(result.km)));
    return result.km;
  };

  const confirmEndFallback = async () => {

      return;

    let kmVal = num(endFallbackForm.km);

    // Strecke nicht erfasst und kein Km-Stand Ende eingetragen: automatisch über die
    // Zwischenziele in Reihenfolge die gefahrene Strecke berechnen.
    if ((kmVal == null || kmVal <= 0) && !endFallbackForm.endOdo) {
      const routeKm = await calcRouteFromWaypoints();
      if (routeKm == null) {
        setEndFallbackError("Kilometer konnten nicht automatisch berechnet werden. Bitte manuell eingeben.");
        return;
      }
      kmVal = routeKm;
    }

    if (kmVal == null || kmVal <= 0) {
      setEndFallbackError("Bitte eine gültige Kilometerangabe machen.");
      return;
    }

    setEndFallbackSaving(true);
    const address = await withPLZ(endFallbackForm.address);
    const waypointAddrs = await withPLZSequential(endFallbackWaypoints.filter((w) => w.trim()));

    let km = Math.round(kmVal);
    if (waypointAddrs.length > 0) {
      const check = await verifyRouteKm([startRef.current.address, ...waypointAddrs, address], km);
      km = check.km;
      if (check.corrected) notifyKmCorrection(check.km);

    const endOdoKm = startRef.current.odoKm != null ? Math.round(startRef.current.odoKm + km) : null;
    setPendingTrip({
      start: startRef.current,
      end: { time: new Date().toISOString(), lat: endFallback.lat, lon: endFallback.lon, address, odoKm: endOdoKm },
      km,

  const handleOdoPhoto = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const dataUrl = reader.result;
      setOdoPhoto(dataUrl);
      setOdoLoading(true);
      setOdoError("");
      try {
        const result = await Tesseract.recognize(dataUrl, "eng");
        const text = result.data.text || "";
        const matches = (text.match(/\d+/g) || []).filter((n) => n.length >= 3);
        const best = matches.sort((a, b) => b.length - a.length)[0];
        if (best) setOdoValue(best);
        else setOdoError("Zahl konnte nicht automatisch erkannt werden. Bitte manuell eingeben.");
      } catch (err) {
        setOdoError("Zahl konnte nicht automatisch erkannt werden. Bitte manuell eingeben.");
      } finally {
        setOdoLoading(false);
      }
    };
    reader.readAsDataURL(file);

  const confirmStartOdo = async (valueOverride) => {

  const confirmZweck = async () => {

    const resolvedAddrs = await withPLZSequential(validWaypoints.map((w) => w.address));
    const waypointAddrs = validWaypoints.map((w, i) => ({ ...w, address: resolvedAddrs[i] }));
    const kmVal = num(pendingKmForm.km);
    let km = kmVal != null ? Math.round(kmVal) : pendingTrip.km;

    if (waypointAddrs.length > 0) {

    const endOdoVal = startOdoVal != null ? Math.round(startOdoVal + km) : pendingKmForm.endOdo ? Math.round(num(pendingKmForm.endOdo)) : pendingTrip.end.odoKm ?? null;
    const trip = {

      start: { ...pendingTrip.start, odoKm: startOdoVal },

      return { ...f, km: value, endOdo };

  };
  const pendingEndOdoChange = (value) => {
    setPendingKmForm((f) => {

  const removePendingWaypoint = (i) => setPendingWaypoints((wp) => wp.filter((_, idx) => idx !== i));

  useEffect(() => {

  const manualKmChange = (value) => {

      const startNum = num(f.startOdo);
      const kmNum = num(value);

      const endNum = num(value);

  const months = Array.from(new Set(trips.map((t) => t.start.time.slice(0, 7)))).sort().reverse();

  // Monatsbericht: beim ersten Öffnen der App in einem neuen Monat wird geprüft, ob für den

  const getPreviousMonthKey = () => {
    const now = new Date();
    const prevMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return prevMonthDate.toISOString().slice(0, 7);

    try {
      const currentMonthKey = new Date().toISOString().slice(0, 7);
      const prevMonthKey = getPreviousMonthKey();
      const already = localStorage.getItem(MONTH_REPORT_KEY);
      const prevMonthTrips = trips
        .filter((t) => t && t.start && t.start.time && t.start.time.slice(0, 7) === prevMonthKey)
        .sort((a, b) => new Date(a.start.time) - new Date(b.start.time));
      if (already !== currentMonthKey && prevMonthTrips.length > 0) {
        setMonthReport({ monthKey: prevMonthKey, currentMonthKey, trips: prevMonthTrips });
      } else {
        setMonthReport(null);
      }
    } catch {
      setMonthReport(null);
    }

      `Fahrer: ${FAHRER}\nFahrzeug: ${FAHRZEUG}\nGesamtkilometer: ${Math.round(sumKm)} km`

    window.location.href = `mailto:${REPORT_EMAIL}?subject=${subject}&body=${body}`;

                      <div key={i} className="flex gap-2">
                        <input type="text" value={w} onChange={(e) => updateEditWaypoint(i, capitalizeWords(e.target.value))} autoFocus={i === editForm.waypoints.length - 1 && !w} className="flex-1 border border-stone-300 bg-white text-stone-900 rounded-lg px-3 py-2 text-sm" />
                        <button type="button" onClick={() => removeEditWaypoint(i)} className="text-stone-400 hover:text-red-500 px-2">✕</button>
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-stone-500 mb-1">Zieladresse</label>
                  <input type="text" value={editForm.endAddress} onChange={(e) => editEndAddressChange(capitalizeWords(e.target.value))} className="w-full border border-stone-300 bg-white text-stone-900 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div className="flex gap-3">
                  <div className="flex-1">
                    <label className="block text-xs font-semibold text-stone-500 mb-1">Km-Stand Start</label>
                    <input type="number" value={editForm.startOdo} onChange={(e) => editStartOdoChange(e.target.value)} className="w-full border border-stone-300 bg-white text-stone-900 rounded-lg px-3 py-2 text-sm font-mono" />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs font-semibold text-stone-500 mb-1">Km-Stand Ende</label>
                    <input type="number" value={editForm.endOdo} onChange={(e) => editEndOdoChange(e.target.value)} className="w-full border border-stone-300 bg-white text-stone-900 rounded-lg px-3 py-2 text-sm font-mono" />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-stone-500 mb-1">Kilometer</label>
                  <input type="number" step="1" value={editForm.km} onChange={(e) => editKmChange(e.target.value)} className="w-full border border-stone-300 bg-white text-stone-900 rounded-lg px-3 py-2 text-sm" />
                  {editRouteLoading ? (
                    <p className="text-xs text-green-600 mt-1">🔄 Kilometer werden anhand der geänderten Orte neu berechnet…</p>
                  ) : (
                    <p className="text-xs text-stone-400 mt-1">Km-Stand Ende und Kilometer gleichen sich automatisch aneinander an. Bei Änderung der Orte werden die Kilometer automatisch neu berechnet.</p>
                  )}
                </div>
                <div>
                  <label className="block text-xs font-semibold text-stone-500 mb-1">Zweck</label>
                  <input type="text" value={editForm.zweck} onChange={(e) => setEditForm({ ...editForm, zweck: e.target.value })} className="w-full border border-stone-300 bg-white text-stone-900 rounded-lg px-3 py-2 text-sm" />
                </div>
              </div>

              <div className="flex gap-2">
                <button onClick={() => { setEditingId(null); setEditForm(null); }} className="flex-1 py-2.5 rounded-lg border border-stone-300 bg-white text-stone-600 text-sm font-medium">Abbrechen</button>
                <button onClick={saveEdit} disabled={editSaving} className="flex-1 py-2.5 rounded-lg bg-gradient-to-r from-green-600 to-lime-500 hover:from-green-500 hover:to-lime-400 disabled:opacity-60 text-white text-sm font-bold">{editSaving ? "PLZ wird ergänzt…" : "Speichern"}</button>
              </div>
            </div>
          </div>
        )}

        {showManual && (
          <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-4">
            <div className="bg-white border border-stone-200 rounded-2xl p-5 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl shadow-green-900/20 ring-1 ring-green-600/10">
              <h2 className="font-bold text-lg mb-4">Fahrt manuell hinzufügen</h2>

              {manualError && (
                <div className="mb-3 flex items-start gap-2 bg-red-50 border border-red-200 text-red-800 text-sm rounded-lg p-2.5">
                  <span>⚠️</span><span>{manualError}</span>
                </div>
              )}

              <div className="space-y-3 mb-4">
                <div className="flex gap-3">
                  <div className="flex-1">
                    <label className="block text-xs font-semibold text-stone-500 mb-1">Datum Beginn</label>
                    <input type="date" value={manualForm.startDate} onChange={(e) => setManualForm({ ...manualForm, startDate: e.target.value })} className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm" />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs font-semibold text-stone-500 mb-1">Beginn</label>
                    <input type="time" value={manualForm.startTime} onChange={(e) => setManualForm({ ...manualForm, startTime: e.target.value })} className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm" />
                  </div>
                </div>
                <div className="flex gap-3">
                  <div className="flex-1">
                    <label className="block text-xs font-semibold text-stone-500 mb-1">Datum Ende</label>
                    <input type="date" value={manualForm.endDate} onChange={(e) => setManualForm({ ...manualForm, endDate: e.target.value })} className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm" />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs font-semibold text-stone-500 mb-1">Ende</label>
                    <input type="time" value={manualForm.endTime} onChange={(e) => setManualForm({ ...manualForm, endTime: e.target.value })} className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm" />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-stone-500 mb-1">Startadresse</label>
                  <input type="text" value={manualForm.startAddress} onChange={(e) => setManualForm({ ...manualForm, startAddress: capitalizeWords(e.target.value) })} placeholder="z. B. Maria-Theresien-Straße 5, 6020 Innsbruck" className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-stone-500 mb-1">Km-Stand Start</label>
                  <input type="number" step="1" value={manualForm.startOdo} onChange={(e) => manualStartOdoChange(e.target.value)} placeholder="optional" className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm font-mono" />
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="block text-xs font-semibold text-stone-500">Zwischenziele (optional)</label>
                    <button type="button" onClick={addManualWaypoint} className="text-xs font-semibold text-green-700">＋ hinzufügen</button>
                  </div>
                  {manualForm.waypoints.length === 0 && (
                    <p className="text-xs text-stone-400">Keine Zwischenziele erfasst.</p>
                  )}
                  <div className="space-y-2">
                    {manualForm.waypoints.map((w, i) => (
                      <div key={i} className="flex gap-2">
                        <input
                          type="text"
                          value={w}
                          onChange={(e) => updateManualWaypoint(i, capitalizeWords(e.target.value))}
                          placeholder={`Zwischenziel ${i + 1}, z. B. Innsbruck`}
                          autoFocus={i === manualForm.waypoints.length - 1 && !w}
                          className="flex-1 border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm"
                        />
                        <button type="button" onClick={() => removeManualWaypoint(i)} className="text-stone-400 hover:text-red-500 px-2">✕</button>
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-stone-500 mb-1">Zieladresse</label>
                  <input type="text" value={manualForm.endAddress} onChange={(e) => setManualForm({ ...manualForm, endAddress: capitalizeWords(e.target.value) })} placeholder="z. B. Landstraße 10, 4020 Linz" className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-stone-500 mb-1">Km-Stand Ende</label>
                  <input type="number" step="1" value={manualForm.endOdo} onChange={(e) => manualEndOdoChange(e.target.value)} placeholder="wird automatisch berechnet" className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm font-mono" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-stone-500 mb-1">Kilometer</label>
                  <input type="number" step="1" min="1" value={manualForm.km} onChange={(e) => manualKmChange(e.target.value)} placeholder="leer lassen für automatische Berechnung" className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm" />
                  <button
                    type="button"
                    onClick={calcManualRoute}
                    disabled={manualRouteLoading}
                    className="text-xs font-semibold text-green-700 mt-1 disabled:opacity-60"
                  >
                    {manualRouteLoading ? "Route wird berechnet…" : "↻ Aus Start/Zwischenzielen/Ziel berechnen"}
                  </button>
                  {manualRouteError && <p className="text-xs text-red-600 mt-1">{manualRouteError}</p>}
                  <p className="text-xs text-stone-400 mt-1">
                    Bleibt Kilometer leer, berechnet die App die Strecke beim Speichern automatisch aus Start, Zwischenzielen und Ziel; Km-Stand Ende wird daraus abgeleitet.
                  </p>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-stone-500 mb-1">Zweck</label>
                  <input type="text" value={manualForm.zweck} onChange={(e) => setManualForm({ ...manualForm, zweck: e.target.value })} placeholder="Zweck eingeben…" className="w-full border border-stone-300 bg-white text-stone-900 placeholder-stone-400 rounded-lg px-3 py-2 text-sm" />
                </div>
              </div>

              <div className="flex gap-2">
                <button onClick={() => setShowManual(false)} className="flex-1 py-2.5 rounded-lg border border-stone-300 bg-white text-stone-600 text-sm font-medium">Abbrechen</button>
                <button onClick={saveManualTrip} disabled={manualSaving} className="flex-1 py-2.5 rounded-lg bg-gradient-to-r from-green-600 to-lime-500 hover:from-green-500 hover:to-lime-400 disabled:opacity-60 text-white text-sm font-bold">{manualSaving ? "PLZ wird ergänzt…" : "Speichern"}</button>
              </div>
            </div>
          </div>
        )}

        {monthTrips.length > 0 && (
          <div className="mb-4">
            <p className="text-xs text-stone-500 mb-1.5">{activeMonth} · {Math.round(monthKm)} km gesamt</p>
            <div className="flex gap-2">
              <button onClick={exportPDF} className="flex-1 flex items-center justify-center gap-2 bg-gradient-to-r from-green-600 to-lime-500 hover:from-green-500 hover:to-lime-400 text-white font-bold rounded-xl py-2.5 text-sm shadow-md shadow-green-600/20">
                📄 PDF
              </button>
              <button onClick={exportExcel} className="flex-1 flex items-center justify-center gap-2 bg-gradient-to-r from-green-600 to-lime-500 hover:from-green-500 hover:to-lime-400 text-white font-bold rounded-xl py-2.5 text-sm shadow-md shadow-green-600/20">
                📊 Excel
              </button>
            </div>
          </div>
        )}

        {months.length > 0 && (
          <div className="mb-4">
            <button
              onClick={() => setShowArchive((s) => !s)}
              className="w-full flex items-center justify-between text-sm font-semibold text-stone-600 bg-white border border-stone-300 rounded-xl px-4 py-2.5"
            >
              <span>📁 Monatsarchiv – frühere Berichte herunterladen</span>
              <span>{showArchive ? "▲" : "▼"}</span>
            </button>
            {showArchive && (
              <div className="mt-2 bg-white border border-stone-200 rounded-xl divide-y divide-stone-100 overflow-hidden">
                {months.map((m) => {
                  const list = tripsForMonthKey(m);
                  const km = list.reduce((s, t) => s + t.km, 0);
                  return (
                    <div key={m} className="flex items-center justify-between px-4 py-2.5 gap-3">
                      <div className="min-w-0">
                        <p className="text-sm font-semibold text-stone-800">{m}</p>
                        <p className="text-xs text-stone-400">{list.length} Fahrt{list.length === 1 ? "" : "en"} · {Math.round(km)} km</p>
                      </div>
                      <div className="flex gap-1.5 shrink-0">
                        <button
                          onClick={() => exportArchiveMonthPdf(m)}
                          className="px-3 py-1.5 rounded-lg border border-green-300 text-green-700 text-xs font-semibold bg-green-50"
                        >
                          📄 PDF
                        </button>
                        <button
                          onClick={() => exportArchiveMonthExcel(m)}
                          className="px-3 py-1.5 rounded-lg border border-green-300 text-green-700 text-xs font-semibold bg-green-50"
                        >
                          📊 Excel
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        <div className="space-y-3">
          {monthTrips.length === 0 && (
            <div className="text-center py-10 text-stone-400 text-sm border border-dashed border-stone-300 rounded-xl">
              Noch keine Fahrten in diesem Monat.<br />Starte oben deine erste Fahrt.
            </div>
          )}
          {[...monthTrips].reverse().map((t) => (
            <div key={t.id} className="bg-white border border-stone-200 rounded-2xl p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-semibold text-stone-500">
                  🕐 {fmtDate(new Date(t.start.time))} · {fmtTime(new Date(t.start.time))}–{fmtTime(new Date(t.end.time))}
                  {t.manual && <span className="ml-1.5 text-stone-400 font-normal">· manuell</span>}
                  {t.edited && <span className="ml-1.5 text-stone-400 font-normal">· bearbeitet</span>}
                </span>
                <div className="flex items-center gap-3">
                  <button onClick={() => openEdit(t)} className="text-stone-300 hover:text-green-700">✏️</button>
                  <button onClick={() => deleteTrip(t.id)} className="text-stone-300 hover:text-red-500">🗑</button>
                </div>
              </div>
              <div className="text-sm space-y-1 mb-2 text-stone-700">
                <div className="flex items-start gap-1.5"><span className="text-green-700">📍</span><span>{t.start.address}</span></div>
                {t.waypoints && t.waypoints.length > 0 && (
                  <div className="flex items-start gap-1.5">
                    <span className="text-amber-500">🅿️</span>
                    <span className="text-stone-500">{waypointsLabel(t)}</span>
                  </div>
                )}
                <div className="flex items-start gap-1.5"><span className="text-stone-400">➜</span><span>{t.end.address}</span></div>
              </div>
              <div className="flex items-center justify-between text-sm">
                <span className="font-mono font-semibold text-stone-900">
                  {Math.round(t.km)} km
                  {t.start.odoKm != null && t.end.odoKm != null && (
                    <span className="text-stone-400 font-normal"> ({Math.round(t.start.odoKm)}–{Math.round(t.end.odoKm)})</span>
                  )}
                </span>
                <span className="text-stone-500">{t.zweck}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      {placeChoice && (
        <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-[999] p-4">
          <div className="bg-white border border-stone-200 rounded-2xl p-5 w-full max-w-md shadow-2xl shadow-green-900/20 ring-1 ring-green-600/10">
            <h2 className="font-bold text-lg mb-1">Mehrere Orte gefunden</h2>
            <p className="text-sm text-stone-500 mb-4">
              Für „{placeChoice.name}" gibt es mehrere Treffer. Bitte den richtigen Ort auswählen:
            </p>
            <div className="space-y-2 mb-4">
              {placeChoice.candidates.map((c, i) => (
                <button
                  key={i}
                  onClick={() => selectPlaceChoice(c)}
                  className="w-full text-left border border-stone-300 rounded-lg px-3 py-2.5 text-sm hover:border-green-600 hover:bg-green-50 transition-colors"
                >
                  <span className="font-mono font-semibold text-stone-900">{c.postcode || "—"}</span>{" "}
                  <span className="text-stone-800">{c.label}</span>
                  {c.region && <span className="text-stone-400"> · {c.region}</span>}
                </button>
              ))}
            </div>
            <button onClick={cancelPlaceChoice} className="w-full py-2.5 rounded-lg border border-stone-300 bg-white text-stone-600 text-sm font-medium">
              Abbrechen
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Fahrtenbuch />);
</script>
</body>
</html>
